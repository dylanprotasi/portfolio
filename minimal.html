html,body{height:100%}
body{font:14px/1.4 var(--ui);color:#1d1d1f;overflow:hidden;background:#eceaf2;-webkit-font-smoothing:antialiased}
.bg{position:fixed;inset:0;background:

.desk{position:fixed;inset:26px 0 0 0;z-index:2}
.ic{position:absolute;width:132px;transform:translate(-50%,-50%) rotate(var(--r,0deg));text-align:center;cursor:pointer;background:none;border:0;font:inherit;color:inherit;animation:pop .5s cubic-bezier(.2,.9,.3,1.3) both}
.ic .th{display:block;width:84px;height:84px;margin:0 auto;border-radius:6px;object-fit:cover;background:#222;box-shadow:0 6px 18px rgba(30,20,60,.28);border:3px solid #fff;transition:transform .25s}

.ic .lb{display:block;margin-top:8px;font:600 12.5px/1.2 var(--ui);letter-spacing:.04em;text-transform:uppercase;color:#fff;text-shadow:0 1px 3px rgba(40,30,80,.7),0 0 10px rgba(40,30,80,.35)}

@keyframes pop{from{opacity:0;transform:translate(-50%,-30%) scale(.7)}to{opacity:1;transform:translate(-50%,-50%) rotate(var(--r,0deg)) scale(1)}}
.dock{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:14px;padding:10px 16px;border-radius:22px;background:rgba(255,255,255,.45);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 0 0 1px rgba(255,255,255,.6) inset,0 10px 30px rgba(40,30,80,.15);z-index:10}

.dock a:hover,.dock button:hover{transform:translateY(-8px) scale(1.12)}
.dock .sep{width:1px;background:rgba(0,0,0,.18);margin:4px 2px}
.dock svg{width:28px;height:28px}
.ov{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:44px 12px 90px;background:rgba(30,25,50,.08)}
.ov.on{display:flex}
.w{width:min(720px,100%);max-height:100%;display:flex;flex-direction:column;background:rgba(243,241,241,.96);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border-radius:14px;box-shadow:0 0 0 1px rgba(0,0,0,.12),0 30px 80px rgba(30,20,60,.35);animation:win .28s cubic-bezier(.2,.9,.3,1.1)}

.bar{display:flex;align-items:center;gap:8px;padding:14px 16px 12px;border-bottom:1px solid #bdbbbb;flex:none}
.bar i{width:13px;height:13px;border-radius:50%;display:block;border:0;cursor:pointer}
.bar i:nth-child(1){background:#ff5f57}.bar i:nth-child(2){background:#febc2e}.bar i:nth-child(3){background:#28c840}
.bar span{margin-left:12px;font-size:15px}
.bd{overflow:auto;padding:16px 20px 22px}
.hd{display:flex;gap:14px;align-items:center}
.hd img,.hd .th2{width:64px;height:64px;border-radius:6px;object-fit:cover;flex:none;background:#222}
.hd .th2{display:flex;align-items:center;justify-content:center;color:#fff;font:800 11px/1 var(--ui);text-transform:uppercase;text-align:center;padding:4px}

.ds{margin-top:14px;background:#fff;padding:9px 11px;color:#555;font-size:15px;line-height:1.5}

.sec{margin-top:14px;font-size:15px;display:flex;gap:6px;align-items:center}
.sec:before{content:"";width:8px;height:8px;border-right:1.5px solid #777;border-bottom:1.5px solid #777;transform:rotate(45deg) translate(-2px,-2px);margin-right:6px}
.kv{margin:8px 0 0 22px;font-size:15px;display:grid;grid-template-columns:auto 1fr;gap:4px 10px}
.kv b{font-weight:500;text-align:right}
.pv{margin:12px 12px 0;display:grid;gap:12px}
.pv img,.pv video{width:100%;display:block;border-radius:10px;background:#111}
.pv.g2{grid-template-columns:1fr 1fr}
.go{display:inline-block;margin:18px 0 0 22px;padding:7px 16px;border-radius:7px;background:#0a84ff;color:#fff;text-decoration:none;font-size:14px;font-weight:500}
.go.alt{background:#fff;color:#1d1d1f;box-shadow:0 0 0 1px rgba(0,0,0,.18);margin-left:8px}
@media(max-width:760px){
 .hero{top:22%}

 .ic{position:static;transform:rotate(var(--r,0deg));width:auto;animation:none}

 .ic .lb{font-size:10.5px}
 .pv.g2{grid-template-columns:1fr}
